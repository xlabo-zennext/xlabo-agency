name: 本番へ自動反映 (surge)

# main に push されるたびに、自動でビルドして本番URLへ反映します。
# これで誰も手元で surge を実行する必要がありません（push するだけ）。※退職サポートと同方式
# 必要な秘密情報は GitHub の Secrets に登録してください：
#   SURGE_LOGIN / SURGE_TOKEN / NEXT_PUBLIC_SUPABASE_URL / NEXT_PUBLIC_SUPABASE_ANON_KEY

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# 同時に2つ走らないようにする（反映のバッティング防止）
concurrency:
  group: deploy-surge
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: 依存インストール
        run: npm install

      - name: ビルド（本番モード＝Supabase接続）
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
          NEXT_PUBLIC_SHEET_WEBAPP_URL: ${{ secrets.NEXT_PUBLIC_SHEET_WEBAPP_URL }}

      - name: surge を導入
        run: npm install -g surge

      - name: 本番URL＋予備URLへ反映
        env:
          SURGE_LOGIN: ${{ secrets.SURGE_LOGIN }}
          SURGE_TOKEN: ${{ secrets.SURGE_TOKEN }}
        run: |
          surge ./out xlabo-honban.surge.sh --token "$SURGE_TOKEN"
          surge ./out xlabo-agency.surge.sh --token "$SURGE_TOKEN"
